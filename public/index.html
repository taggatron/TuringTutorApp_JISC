<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ChatGPT Web App</title>
    <!-- Google Fonts: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="style.css?v=2">
    <link rel="stylesheet" href="/css/index.css">
    <script defer src="/js/csrf-auto.js"></script>
    <!-- moved inline styles to /css/index.css -->

</head>

<body>

    <div class="container">
        <div class="sidebar" id="sidebar">
            <button class="sidebar-toggle-btn" id="sidebar-toggle-btn" title="Toggle sidebar"
                aria-label="Toggle sidebar">
                <span class="sidebar-brackets" id="sidebar-brackets-icon"><span
                        style="color:#582C83; font-weight:900; font-size:1.4rem; letter-spacing:2px;">[&nbsp;]</span></span>
                <span class="sidebar-collapse-arrow" id="sidebar-collapse-arrow">◀</span>
            </button>
            <div class="sidebar-header">
                <div id="sidebar-logo"
                    style="display: flex; justify-content: left; padding: 2px 0 2px 0;"><img
                        src="sdc-logo.svg" alt="SDC Logo" height="25"></div>
            </div>
            <div class="sidebar-actions">
                <button class="turing-mode-button" id="turing-mode-button" title="Start Turing Mode (editor)"
                    aria-label="Start Turing Mode">
                    <span class="plus">+</span>
                    <img class="turing-mode-icon" src="ChatGPT Image Oct 13, 2025, 01_56_50 PM.png" alt="">
                </button>
                <button class="new-chat-button" id="new-chat-button">+ 💬</button>
                <button class="new-group-button" id="new-group-button">+ 📁</button>
            </div>
            <div class="sidebar-content">
                <!-- Turing Mode placeholder lives above sessions -->
                <div id="turing-mode-container"></div>
                <!-- Replace the existing groups in the sidebar with this structure -->
                <div id="session-groups">
                    <!-- Groups will be added here dynamically -->
                </div>
                <div id="new-chats"></div> <!-- Container for new chats -->
            </div>
        </div>
        <div class="chat-container">
            <div class="chat-surface">
                <div id="chat-messages" class="chat-messages">
                    <!-- Welcome state shown when no messages exist -->
                    <div id="chat-welcome" class="chat-welcome">
                        <div class="chat-welcome-inner">
                            <div class="chat-welcome-logo">
                                <img src="sdc-logo.svg" alt="SDC Logo" height="40">
                            </div>
                            <h2 class="chat-welcome-title">How can I help you today?</h2>
                            <p class="chat-welcome-subtitle">Start a conversation or try one of these prompts:</p>
                            <div class="chat-starter-prompts">
                                <button class="chat-starter-btn"
                                    data-prompt="Explain this topic in a way a student can understand and give me 3 key points to remember.">
                                    <span class="starter-icon">📚</span>
                                    <span class="starter-text">Explain a topic simply<br><small>Get a clear breakdown
                                            with key points</small></span>
                                </button>
                                <button class="chat-starter-btn"
                                    data-prompt="Help me plan a lesson on this subject. Include learning objectives, activities and assessment ideas.">
                                    <span class="starter-icon">📝</span>
                                    <span class="starter-text">Plan a lesson<br><small>Get learning objectives &
                                            activities</small></span>
                                </button>
                                <button class="chat-starter-btn"
                                    data-prompt="Give me feedback on this work. Highlight strengths and areas for improvement.">
                                    <span class="starter-icon">💡</span>
                                    <span class="starter-text">Get feedback on work<br><small>Strengths & areas to
                                            improve</small></span>
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            <div class="meta-container">
                <div class="chat-input">
                    <button class="tools-toggle" id="tools-toggle" title="Tools" aria-label="Tools"
                        tabindex="0">
                        <!-- Supplied gemini-svg.svg, inlined so its two gear sections can animate as stable groups. -->
                        <svg class="tools-toggle-icon" viewBox="0 0 350 300" aria-hidden="true" focusable="false">
                            <defs>
                                <linearGradient id="tools-gear-metal" x1="0%" y1="0%" x2="100%" y2="100%">
                                    <stop offset="0%" stop-color="#E2E8F0" />
                                    <stop offset="40%" stop-color="#94A3B8" />
                                    <stop offset="100%" stop-color="#475569" />
                                </linearGradient>
                                <linearGradient id="tools-gear-metal-dark" x1="0%" y1="100%" x2="100%" y2="0%">
                                    <stop offset="0%" stop-color="#475569" />
                                    <stop offset="100%" stop-color="#1E293B" />
                                </linearGradient>
                                <linearGradient id="tools-gear-metal-light" x1="100%" y1="0%" x2="0%" y2="100%">
                                    <stop offset="0%" stop-color="#E2E8F0" />
                                    <stop offset="40%" stop-color="#CBD5E1" />
                                    <stop offset="100%" stop-color="#64748B" />
                                </linearGradient>

                                <mask id="tools-gear-center-hole">
                                    <rect width="100%" height="100%" fill="white" />
                                    <circle cx="150" cy="150" r="28" fill="black" />
                                </mask>
                                <mask id="tools-gear-outer-hole">
                                    <rect width="100%" height="100%" fill="white" />
                                    <circle cx="150" cy="150" r="95" fill="black" />
                                </mask>

                                <g id="tools-gear-tooth">
                                    <path d="M 131,35 L 139,8 Q 150,-2 161,8 L 169,35 Z" />
                                </g>
                                <g id="tools-gear-outer-base">
                                    <circle cx="150" cy="150" r="118" />
                                    <use href="#tools-gear-tooth" />
                                    <use href="#tools-gear-tooth" transform="rotate(20, 150, 150)" />
                                    <use href="#tools-gear-tooth" transform="rotate(40, 150, 150)" />
                                    <use href="#tools-gear-tooth" transform="rotate(60, 150, 150)" />
                                    <use href="#tools-gear-tooth" transform="rotate(80, 150, 150)" />
                                    <use href="#tools-gear-tooth" transform="rotate(100, 150, 150)" />
                                    <use href="#tools-gear-tooth" transform="rotate(120, 150, 150)" />
                                    <use href="#tools-gear-tooth" transform="rotate(140, 150, 150)" />
                                    <use href="#tools-gear-tooth" transform="rotate(160, 150, 150)" />
                                    <use href="#tools-gear-tooth" transform="rotate(180, 150, 150)" />
                                    <use href="#tools-gear-tooth" transform="rotate(200, 150, 150)" />
                                    <use href="#tools-gear-tooth" transform="rotate(220, 150, 150)" />
                                    <use href="#tools-gear-tooth" transform="rotate(240, 150, 150)" />
                                    <use href="#tools-gear-tooth" transform="rotate(260, 150, 150)" />
                                    <use href="#tools-gear-tooth" transform="rotate(280, 150, 150)" />
                                    <use href="#tools-gear-tooth" transform="rotate(300, 150, 150)" />
                                    <use href="#tools-gear-tooth" transform="rotate(320, 150, 150)" />
                                    <use href="#tools-gear-tooth" transform="rotate(340, 150, 150)" />
                                </g>
                                <g id="tools-gear-outer" mask="url(#tools-gear-outer-hole)">
                                    <use href="#tools-gear-outer-base" />
                                </g>
                                <g id="tools-gear-inner-dots">
                                    <circle cx="150" cy="75" r="7" />
                                    <circle cx="150" cy="75" r="7" transform="rotate(30, 150, 150)" />
                                    <circle cx="150" cy="75" r="7" transform="rotate(60, 150, 150)" />
                                    <circle cx="150" cy="75" r="7" transform="rotate(90, 150, 150)" />
                                    <circle cx="150" cy="75" r="7" transform="rotate(120, 150, 150)" />
                                    <circle cx="150" cy="75" r="7" transform="rotate(150, 150, 150)" />
                                    <circle cx="150" cy="75" r="7" transform="rotate(180, 150, 150)" />
                                    <circle cx="150" cy="75" r="7" transform="rotate(210, 150, 150)" />
                                    <circle cx="150" cy="75" r="7" transform="rotate(240, 150, 150)" />
                                    <circle cx="150" cy="75" r="7" transform="rotate(270, 150, 150)" />
                                    <circle cx="150" cy="75" r="7" transform="rotate(300, 150, 150)" />
                                    <circle cx="150" cy="75" r="7" transform="rotate(330, 150, 150)" />
                                </g>
                            </defs>

                            <g class="tools-gear-wrapper" transform="translate(45, 0) scale(0.85, 1)"
                                pointer-events="none">
                                <g class="tools-gear-outer">
                                    <g transform="translate(-20, 0)"><use href="#tools-gear-outer" fill="#131f33" /></g>
                                    <g transform="translate(-19, 0)"><use href="#tools-gear-outer" fill="#162338" /></g>
                                    <g transform="translate(-18, 0)"><use href="#tools-gear-outer" fill="#19273d" /></g>
                                    <g transform="translate(-17, 0)"><use href="#tools-gear-outer" fill="#1d2c42" /></g>
                                    <g transform="translate(-16, 0)"><use href="#tools-gear-outer" fill="#203047" /></g>
                                    <g transform="translate(-15, 0)"><use href="#tools-gear-outer" fill="#23354c" /></g>
                                    <g transform="translate(-14, 0)"><use href="#tools-gear-outer" fill="#273a51" /></g>
                                    <g transform="translate(-13, 0)"><use href="#tools-gear-outer" fill="#2a3e56" /></g>
                                    <g transform="translate(-12, 0)"><use href="#tools-gear-outer" fill="#2e435b" /></g>
                                    <g transform="translate(-11, 0)"><use href="#tools-gear-outer" fill="#314860" /></g>
                                    <g transform="translate(-10, 0)"><use href="#tools-gear-outer" fill="#354c65" /></g>
                                    <g transform="translate(-9, 0)"><use href="#tools-gear-outer" fill="#38516a" /></g>
                                    <g transform="translate(-8, 0)"><use href="#tools-gear-outer" fill="#3c566f" /></g>
                                    <g transform="translate(-7, 0)"><use href="#tools-gear-outer" fill="#3f5a74" /></g>
                                    <g transform="translate(-6, 0)"><use href="#tools-gear-outer" fill="#435f79" /></g>
                                    <g transform="translate(-5, 0)"><use href="#tools-gear-outer" fill="#46647e" /></g>
                                    <g transform="translate(-4, 0)"><use href="#tools-gear-outer" fill="#4a6983" /></g>
                                    <g transform="translate(-3, 0)"><use href="#tools-gear-outer" fill="#4d6d88" /></g>
                                    <g transform="translate(-2, 0)"><use href="#tools-gear-outer" fill="#51728d" /></g>
                                    <g transform="translate(-1, 0)"><use href="#tools-gear-outer" fill="#547792" /></g>

                                    <g>
                                        <use href="#tools-gear-outer" fill="url(#tools-gear-metal)" />
                                        <circle cx="150" cy="150" r="116" fill="none" stroke="#CBD5E1"
                                            stroke-width="1.5" mask="url(#tools-gear-outer-hole)" />
                                        <circle cx="150" cy="150" r="95" fill="none" stroke="#1E293B"
                                            stroke-width="2" />
                                    </g>
                                </g>

                                <g class="tools-gear-inner">
                                    <g>
                                        <circle cx="150" cy="150" r="94.5" fill="url(#tools-gear-metal-dark)"
                                            mask="url(#tools-gear-center-hole)" />
                                        <circle cx="150" cy="150" r="93" fill="none" stroke="#475569"
                                            stroke-width="1.5" mask="url(#tools-gear-center-hole)" />
                                        <g fill="#162338" stroke="#475569" stroke-width="1.5">
                                            <use href="#tools-gear-inner-dots" />
                                        </g>
                                    </g>

                                    <g transform="translate(-8, 0)"><circle cx="150" cy="150" r="55" fill="#23354c" mask="url(#tools-gear-center-hole)" /></g>
                                    <g transform="translate(-7, 0)"><circle cx="150" cy="150" r="55" fill="#2a3e56" mask="url(#tools-gear-center-hole)" /></g>
                                    <g transform="translate(-6, 0)"><circle cx="150" cy="150" r="55" fill="#314860" mask="url(#tools-gear-center-hole)" /></g>
                                    <g transform="translate(-5, 0)"><circle cx="150" cy="150" r="55" fill="#38516a" mask="url(#tools-gear-center-hole)" /></g>
                                    <g transform="translate(-4, 0)"><circle cx="150" cy="150" r="55" fill="#3f5a74" mask="url(#tools-gear-center-hole)" /></g>
                                    <g transform="translate(-3, 0)"><circle cx="150" cy="150" r="55" fill="#46647e" mask="url(#tools-gear-center-hole)" /></g>
                                    <g transform="translate(-2, 0)"><circle cx="150" cy="150" r="55" fill="#4d6d88" mask="url(#tools-gear-center-hole)" /></g>
                                    <g transform="translate(-1, 0)"><circle cx="150" cy="150" r="55" fill="#547792" mask="url(#tools-gear-center-hole)" /></g>

                                    <g>
                                        <circle cx="150" cy="150" r="55" fill="url(#tools-gear-metal-light)"
                                            stroke="#475569" stroke-width="1" mask="url(#tools-gear-center-hole)" />
                                        <circle cx="150" cy="150" r="53" fill="none" stroke="#E2E8F0"
                                            stroke-width="2" mask="url(#tools-gear-center-hole)" />
                                        <circle cx="150" cy="150" r="30" fill="none" stroke="#1E293B"
                                            stroke-width="2" />
                                        <circle cx="150" cy="150" r="32" fill="none" stroke="#94A3B8"
                                            stroke-width="1.5" />
                                    </g>
                                </g>
                            </g>
                        </svg>
                    </button>
                    <textarea id="message-input" rows="1" placeholder="Type your message..."></textarea>
                    <button class="send-message-button"></button>
                </div>
                <!-- Example Prompts Section -->
                <div class="example-prompts">
                    <div class="prompt-header">
                        <button class="create-reference-button">ChatGPT Reference</button>
                        <button class="prompt-examples-button">Prompt Examples</button>
                        <div class="prompt-buttons">
                            <button class="prompt-button" data-type="research">Research</button>
                            <button class="prompt-button" data-type="editing">Editing</button>
                            <button class="prompt-button" data-type="drafting">Drafting</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>


    </div>

    <!-- Pop-up for scale explanations -->
    <div id="scale-popup" class="popup"></div>

    <!-- Prompt Pop-up -->
    <div id="prompt-popup" class="prompt-popup">
        <div class="popup-content">
            <span class="close-button">&times;</span>
            <div id="prompt-content"></div>
        </div>
    </div>

    <div id="feedback-container-template" class="feedback-container">
        <p class="feedback-message"></p>
    </div>

    <!-- AI Assessment Scale -->
    <div class="ai-assessment-scale" id="ai-assessment-scale" role="radiogroup" aria-label="AI assessment scale">
        <div id="scale-5" class="scale-item inactive" role="radio" aria-checked="false">Full AI</div>
        <div id="scale-4" class="scale-item inactive" role="radio" aria-checked="false">AI + Human Evaluation</div>
        <div id="scale-3" class="scale-item inactive" role="radio" aria-checked="false">AI Editing</div>
        <div id="scale-2" class="scale-item inactive" role="radio" aria-checked="false">Ideas and Structure</div>
        <div id="scale-1" class="scale-item inactive" role="radio" aria-checked="false">No AI</div>
        <!-- scale items only; animated description lives in a separate container below -->
    </div>

    <!-- animated text used by the scale descriptions; placed in its own container below the scale -->
    <div id="ai-assessment-desc" class="ai-assessment-desc">
        <div id="animated-text" class="animated-text" aria-live="polite"></div>
    </div>

    <!-- favicon (use attached ChatGPT image as tab icon) -->
    <link rel="icon" type="image/png" href="/ChatGPT%20Image%20Oct%2013%2C%202025%2C%2001_56_50%20PM.png">

    <!-- global popup overlay used by prompt/reference popups -->
    <div id="popup-overlay" class="popup-overlay" aria-hidden="true"></div>

    <!-- Reference Pop-up -->
    <div id="reference-popup" class="reference-popup">
        <span class="close-button">&times;</span>
        <p id="reference-content"></p>
        <div class="reference-actions">
            <button id="copy-image-btn" type="button">Copy prompt + AI as image</button>
            <button id="download-image-btn" type="button">Download PNG</button>
        </div>
    </div>

    <!-- Load main client script -->
    <script defer src="/js/index.js"></script>
</body>

</html>
